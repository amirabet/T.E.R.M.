<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>>_ T.E.R.M. studio</title>
	<link rel="stylesheet" href="./term-studio.css" />
	<link rel="stylesheet" href="../style/term.css" />
</head>

<body>
	<main>
		<div id="toast"></div>

		<header class="crt">
			<h1>>_$ T.E.R.M. studio <span class="cursor">_</span></h1>
		</header>

		<div class="tab-row">
			<button class="tab on" id="tab-face" onclick="switchTab('face', this)">STATES</button>
			<button class="tab" id="tab-test" onclick="switchTab('test', this)">SCENARIOS</button>
		</div>

		<!-- =================== FACE =================== -->
		<div id="tp-face" class="tp on">

			<!-- STATES MANAGER -->
			<div class="sec" style="margin-bottom: 8px">
				<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 7px">
					<div class="sh">STATES</div>
					<div style="flex: 1"></div>
					<button class="btn" onclick="importStatesFile()" title="Load states from a JSON file">&#8593;
						import</button>
					<button class="btn acc" onclick="exportStatesFile()" title="Save all states to a JSON file">&#8595;
						export</button>
				</div>

				<label>current states</label>
				<div class="states-bar" id="states-bar"></div>
				<div class="row" style="gap: 5px; align-items: flex-end; vertical-align: bottom; margin-bottom: 6px">
					<div>
						<label for="new-state-in">add new state</label>
						<input type="text" id="new-state-in" placeholder="new state name…"
							style="font-size: 11px; width: 160px; text-align: left" />
					</div>
					<button class="btn " onclick="addNewState()">+ add</button>
				</div>
				<button class="btn danger" onclick="deleteCurrentState()">&#10005; delete selected state</button>
				<input type="file" id="import-json-input" accept=".json" style="display: none"
					onchange="onImportFileChange(this)" />
			</div>

			<div class="">
				<div class="left">

					<!-- TIMELINE -->
					<div class="sec">
						<div class="row" style="gap: 16px; align-items: flex-start; vertical-align: top">
							<div style="flex: 1">
								<div class="sh">FRAMES</div>
								<div id="frames-row" style="margin-bottom: 8px"></div>
								<div class="row">
									<button class="btn acc" onclick="addFrame()">+ frame</button>
									<button class="btn" onclick="dupFrame()">⎘ dup</button>
									<button class="btn danger" onclick="delFrame()">✕ del</button>
									<div style="flex: 1"></div>
								</div>
							</div>
							<div style="flex: 1">
								<div class="sh">STAGE</div>
								<!-- STAGE -->
								<div id="stage-wrap" class="crt">
									<div id="stage-face"></div>
								</div>
								<div class="row"
									style="margin-top: 8px; gap: 4px; justify-content: center; align-items: center; vertical-align: top">
									<button class="btn" onclick="goFirstFrame()">|◀</button>
									<button class="btn" onclick="stepFrame(-1)">◀</button>
									<button class="btn acc" style="width: 32px; height: 26px;" id="play-btn"
										onclick="togglePlay()">
										▶
									</button>
									<button class="btn" onclick="stepFrame(1)">▶</button>
									<button class="btn" onclick="goLastFrame()">▶|</button>
									<input type="range" id="speed-r" min="0" max="5000" value="100" step="100"
										oninput="setSpeed(this.value)" />
									<span id="speed-lbl"
										style="font-size: 10px; color: var(--text3); width: 28px">x1</span>
								</div>
							</div>
						</div>


					</div>

					<!-- CHARACTER EDITOR -->
					<div class="sec">
						<div class="sh">EDIT FRAME</div>

						<!-- FACE -->
						<div id="wrap-face">
							<div class="row" style="margin-bottom: 6px">
								<div style="flex:1">
									<label for="face-in">characters</label>
									<input type="text" id="face-in" value="._." placeholder="face goes here..."
										oninput="onFaceInput()" />
								</div>
								<div style="flex:1">
									<label for="ms-in">frame
										duration</label>
									<input type="number" id="ms-in" min="0" max="10000" value="300" step="100"
										oninput="onMsInput()" />
									<span style="font-size: 10px; color: var(--text3)">ms. | 0 = infinite</span>
								</div>
							</div>
							<label>Edit Chars</label>
							<div class="char-row" id="face-row"></div>
						</div>

						<div class="sel-info" id="sel-info">
							— click a character to select | shift+click = multiselection
						</div>
						<div style="display: flex; gap: 6px;">
							<button class="btn" onclick="selectAll('face')">select all</button>
							<button class="btn danger" onclick="clearSelStyle()">clear selected</button>
							<button class="btn danger" onclick="clearAllStyles()">clear all</button>
						</div>
						<!-- Character attribute-->
						<div class="row" style="margin-top: 8px; gap: 12px; align-items: flex-start;">
							<div class="sec" style="flex: 1">
								<label>TEXT COLOR</label>
								<div class="palette" id="fg-pal"></div>
							</div>

							<div class="sec" style="flex: 1">
								<label>BACKGROUND COLOR</label>
								<div class="palette" id="bg-pal"></div>
							</div>

							<div class="sec">
								<label>ATTRIBUTES</label>
								<div class="attr-row" id="attr-row"></div>
							</div>
						</div>
					</div>

					<!-- EXPRESSIONS -->
					<div class="sec" style="margin-bottom: 30px">
						<div class="sh">EXPRESSIONS</div>
						<div class="face-grid" id="face-grid"></div>
					</div>

				</div>

				<!-- /layout -->
			</div>
		</div>
		<!-- /tp-face -->

		<!-- =================== SCENARIOS =================== -->
		<div id="tp-test" class="tp">
			<div class="sec" style="margin-bottom: 30px">
				<div class="sh" style="margin-bottom: 8px">CHAINED SCENARIOS</div>
				<div style="font-size: 10px; color: var(--text3); margin-bottom: 7px">
					Configure up to 5 scenarios. Each one has state, message, message mode, and duration.
					The stage below plays them sequentially.
				</div>
				<div id="test-stage-wrap" class="crt">
					<div id="test-stage-face"></div>
					<div id="test-stage-msg"></div>

				</div>
				<div id="test-stage-meta"></div>
				<div class="row" style="margin: 8px 0">
					<button class="btn acc" onclick="runTestChain()" id="test-run-btn">▶ run chain</button>
					<button class="btn " onclick="stopTestChain()">|◀ rewind</button>
					<div style="flex: 1"></div>
					<span id="test-count" style="font-size: 10px; color: var(--text3)">1/5</span> <button class="btn"
						onclick="downloadAllScenariosPy()"
						title="Download all scenarios as a single Python file">&#8595; all .py</button> <button
						class="btn acc" onclick="addTestScenario()">+ Add scenario</button>
				</div>
				<div id="test-scenarios" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"></div>

			</div>


		</div>
		<!-- /tp-test -->
	</main>

	<script src="./term-studio.js"></script>
</body>

</html>
